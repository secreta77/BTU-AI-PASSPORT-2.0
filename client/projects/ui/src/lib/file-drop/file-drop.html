<div
  class="drop"
  [class.drop--active]="isDragging()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave()"
  (drop)="onDrop($event)"
>
  <p class="drop__text">{{ dropText() }}</p>
  <button class="drop__button" type="button" (click)="fileInput.click()">
    {{ chooseText() }}
  </button>
  <input
    #fileInput
    hidden
    type="file"
    [accept]="accept()"
    (change)="onInputChange($event)"
  />
</div>
