<header class="header">
  <div class="header__inner">
    <a class="header__title" routerLink="/verify">{{ 'header.title' | t }}</a>

    <nav class="header__nav" [attr.aria-label]="'header.title' | t">
      @if (authService.isLoggedIn()) {
        <a class="header__link" routerLink="/my-passport">{{ 'header.myPassport' | t }}</a>
        <button class="header__link" type="button" (click)="logout()">
          {{ 'header.logout' | t }}
        </button>
      } @else {
        <a class="header__link" routerLink="/login">{{ 'header.login' | t }}</a>
      }
    </nav>

    <div class="header__lang" role="group" [attr.aria-label]="'lang.label' | t">
      @for (lang of languages; track lang.code) {
        <button
          type="button"
          class="header__lang-button"
          [class.header__lang-button--active]="languageService.language() === lang.code"
          [attr.aria-pressed]="languageService.language() === lang.code"
          (click)="languageService.setLanguage(lang.code)"
        >
          {{ lang.labelKey | t }}
        </button>
      }
    </div>
  </div>
</header>
