<h1>{{ 'admin.title' | t: language() }}</h1>

<form class="card form" (submit)="submit($event)">
  <div class="field">
    <label for="admin-key">{{ 'admin.login.keyLabel' | t: language() }}</label>
    <input
      id="admin-key"
      class="field__input"
      type="password"
      autocomplete="off"
      [formControl]="key"
    />
  </div>
  <button class="button" type="submit" [disabled]="key.invalid">
    {{ 'login.submit' | t: language() }}
  </button>

  <!-- The live region always exists, so the screen reader announces the error when it appears -->
  <div aria-live="polite">
    @if (adminAuth.keyRejected()) {
      <p class="notice notice--error">{{ 'admin.login.invalid' | t: language() }}</p>
    }
  </div>
</form>
