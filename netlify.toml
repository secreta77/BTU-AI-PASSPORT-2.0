[build]
  base = "client"
  command = "npm run build"
  # Relative to base ("client"), matches Angular's default output folder
  publish = "dist/BTU-AI-PASSPORT/browser"

[build.environment]
  NODE_VERSION = "24"

# Proxy to the real API. Must stay ABOVE the SPA redirect, otherwise the SPA catches /api
[[redirects]]
  from = "/api/*"
  to = "https://btu-ai-passport-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback: lets /verify/BTU-V-... open directly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Pages with personal data or no search value stay out of search results.
# /verify and /verify/* are NOT listed: a "/verify/*" rule would also match "/verify" and
# block the public page. Code pages are protected by meta robots noindex (SeoService).
# Header rules are matched before redirects, so they also apply to SPA-served paths.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/my-passport"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Security headers on every page. No Content-Security-Policy yet: it needs testing with the
# Angular inline styles, the Google Fonts and the public RPC calls first.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
